  <h1>भारत का राष्ट्रगान — Jana Gana Mana</h1>
  <p>Jana gana mana adhinayaka jaya he<br>
  Bharata bhagya vidhata<br>
  Punjab Sindhu Gujarata Maratha<br>
  Dravida Utkala Banga</p>

  <p>Tava shubha name jage<br>
  Tava shubha ashisha mage</p>
  <p>Gaahe tava jay gaatha<br>
  Jana gana mangala daayak jay je</p>

  <p>Jaya he, jaya he, jaya he<br>
  Jaya jaya jaya, jaya he</p>
